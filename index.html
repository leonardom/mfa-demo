<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MFA Demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
  }
  /* Top bar */
  .topbar {
    background: #010409;
    border-bottom: 1px solid #30363d;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    font-weight: 700;
    font-size: 18px;
    color: #e6edf3;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-logo {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .topbar-actions { display: flex; gap: 8px; align-items: center; }
  .user-chip {
    display: flex; align-items: center; gap: 8px;
    background: #21262d; padding: 4px 12px 4px 4px;
    border-radius: 999px; cursor: pointer;
    border: 1px solid #30363d;
  }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: white;
  }
  /* Buttons */
  .btn {
    background: #21262d; color: #e6edf3;
    border: 1px solid #30363d; padding: 6px 14px;
    border-radius: 6px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all .15s;
  }
  .btn:hover { background: #30363d; border-color: #8b949e; }
  .btn-primary {
    background: #238636; border-color: #2ea043; color: white;
  }
  .btn-primary:hover { background: #2ea043; }
  .btn-danger { background: #21262d; border-color: #f85149; color: #f85149; }
  .btn-danger:hover { background: #f85149; color: white; }
  .btn-lg { padding: 10px 20px; font-size: 14px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Layout */
  .container {
    max-width: 900px; margin: 0 auto; padding: 32px 24px;
  }
  .card {
    background: #0d1117; border: 1px solid #30363d;
    border-radius: 8px; overflow: hidden;
  }
  .card-header {
    padding: 16px 20px; border-bottom: 1px solid #30363d;
    background: #161b22; font-weight: 600; font-size: 16px;
  }
  .card-body { padding: 20px; }

  /* Greeting */
  .hero {
    text-align: center; padding: 80px 20px;
  }
  .hero h1 {
    font-size: 42px; margin: 0 0 16px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero p { font-size: 18px; color: #8b949e; max-width: 600px; margin: 0 auto 32px; }
  .hero-actions { display: flex; gap: 12px; justify-content: center; }

  /* MFA list */
  .mfa-method {
    display: flex; align-items: flex-start; gap: 16px;
    padding: 20px; border-bottom: 1px solid #30363d;
  }
  .mfa-method:last-child { border-bottom: none; }
  .mfa-icon {
    width: 32px; height: 32px; flex-shrink: 0;
    color: #8b949e;
  }
  .mfa-info { flex: 1; min-width: 0; }
  .mfa-title-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .mfa-title { font-size: 16px; font-weight: 600; }
  .mfa-desc { color: #8b949e; font-size: 13px; line-height: 1.5; }
  .mfa-actions { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    font-weight: 500; border: 1px solid;
  }
  .badge-success { color: #3fb950; border-color: #3fb950; }
  .badge-warn { color: #d29922; border-color: #d29922; }
  .badge-primary { color: #58a6ff; border-color: #58a6ff; background: rgba(56,139,253,.1); }
  .badge-muted { color: #8b949e; border-color: #30363d; }

  /* Forms */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 8px 12px; font-size: 14px;
    background: #0d1117; color: #e6edf3;
    border: 1px solid #30363d; border-radius: 6px;
  }
  .field input:focus { outline: none; border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(56,139,253,.3); }

  .flash {
    padding: 10px 14px; border-radius: 6px; margin-bottom: 16px;
    font-size: 13px;
  }
  .flash-error { background: rgba(248,81,73,.1); border: 1px solid #f85149; color: #ff7b72; }
  .flash-success { background: rgba(63,185,80,.1); border: 1px solid #3fb950; color: #56d364; }

  .auth-card { max-width: 400px; margin: 60px auto; }
  .center-title { text-align: center; margin-bottom: 24px; font-size: 24px; }

  .codes-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    background: #161b22; padding: 16px; border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, monospace; font-size: 14px;
    margin: 12px 0;
  }
  .codes-grid div { padding: 6px 8px; background: #0d1117; border-radius: 4px; }

  .radio-row { display: flex; align-items: center; gap: 8px; }
  .link {
    background: none; border: none; color: #58a6ff;
    cursor: pointer; padding: 0; font-size: 13px;
  }
  .link:hover { text-decoration: underline; }

  .dropdown {
    position: absolute; right: 24px; top: 60px;
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    min-width: 200px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
    z-index: 100; overflow: hidden;
  }
  .dropdown button {
    display: block; width: 100%; text-align: left;
    background: none; border: none; color: #e6edf3;
    padding: 10px 14px; cursor: pointer; font-size: 13px;
  }
  .dropdown button:hover { background: #21262d; }
  .dropdown-divider { height: 1px; background: #30363d; }
  .dropdown-header { padding: 10px 14px; font-size: 12px; color: #8b949e; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" id="brandBtn">
    <span class="brand-logo">🔐</span>
    <span>MFA Demo</span>
  </div>
  <div class="topbar-actions" id="topbarActions"></div>
</div>

<div id="app"></div>

<script>
/* ============== STATE ============== */
const users = {
  user1: { username: 'user1', password: 'password123', mfa: { recoveryCodes: [], passkey: false, authenticatorApp: false, sms: null, primary: null } },
  user2: { username: 'user2', password: 'password123', mfa: { recoveryCodes: [], passkey: false, authenticatorApp: false, sms: null, primary: null } },
  user3: { username: 'user3', password: 'password123', mfa: { recoveryCodes: [], passkey: false, authenticatorApp: false, sms: null, primary: null } },
};

const session = {
  currentUser: null,       // logged in username
  pendingMfaUser: null,    // awaiting MFA
  view: 'home',            // home | login | signup | mfa | profile
  flash: null,
  dropdownOpen: false,
};

/* ============== HELPERS ============== */
function flash(type, msg) { session.flash = { type, msg }; render(); setTimeout(() => { if (session.flash && session.flash.msg === msg) { session.flash = null; render(); } }, 4000); }
function genCode(len = 10) {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = ''; for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function hasAnyMfa(u) { return u.mfa.passkey || u.mfa.authenticatorApp || u.mfa.sms || u.mfa.recoveryCodes.length > 0; }
function methodEnabled(u, m) {
  if (m === 'passkey') return u.mfa.passkey;
  if (m === 'authenticatorApp') return u.mfa.authenticatorApp;
  if (m === 'sms') return !!u.mfa.sms;
  if (m === 'recovery') return u.mfa.recoveryCodes.length > 0;
  return false;
}

/* ============== TOP BAR ============== */
function renderTopbar() {
  const el = document.getElementById('topbarActions');
  if (session.currentUser) {
    const u = users[session.currentUser];
    const initial = u.username.charAt(0).toUpperCase();
    el.innerHTML = `
      <div class="user-chip" id="userChip">
        <span class="avatar">${initial}</span>
        <span style="font-size:13px;font-weight:500;">${u.username}</span>
      </div>
    `;
    document.getElementById('userChip').onclick = (e) => {
      e.stopPropagation();
      session.dropdownOpen = !session.dropdownOpen;
      render();
    };
    if (session.dropdownOpen) {
      const dd = document.createElement('div');
      dd.className = 'dropdown';
      dd.innerHTML = `
        <div class="dropdown-header">Signed in as <strong>${u.username}</strong></div>
        <div class="dropdown-divider"></div>
        <button id="ddProfile">Your profile & MFA</button>
        <div class="dropdown-divider"></div>
        <button id="ddLogout" style="color:#f85149">Sign out</button>
      `;
      document.body.appendChild(dd);
      dd.onclick = (e) => e.stopPropagation();
      document.getElementById('ddProfile').onclick = () => { session.dropdownOpen = false; session.view = 'profile'; render(); };
      document.getElementById('ddLogout').onclick = () => { session.currentUser = null; session.dropdownOpen = false; session.view = 'home'; flash('success', 'Signed out'); };
    }
  } else {
    el.innerHTML = `
      <button class="btn" id="navSignin">Sign in</button>
      <button class="btn btn-primary" id="navSignup">Sign up</button>
    `;
    document.getElementById('navSignin').onclick = () => { session.view = 'login'; render(); };
    document.getElementById('navSignup').onclick = () => { session.view = 'signup'; render(); };
  }
  document.getElementById('brandBtn').onclick = () => {
    session.view = session.currentUser ? 'profile' : 'home';
    render();
  };
}

/* ============== VIEWS ============== */
function renderHome() {
  return `
    <div class="container">
      <div class="hero">
        <h1>Welcome to MFA Demo</h1>
        <p>A frontend-only demonstration of multi-factor authentication flows: passkeys, authenticator apps, SMS, and recovery codes.</p>
        <div class="hero-actions">
          <button class="btn btn-primary btn-lg" id="heroSignin">Sign in</button>
          <button class="btn btn-lg" id="heroSignup">Create account</button>
        </div>
        <p style="margin-top:40px;font-size:13px;color:#6e7681;">
          Demo accounts: <code style="background:#161b22;padding:2px 6px;border-radius:3px;">user1</code> /
          <code style="background:#161b22;padding:2px 6px;border-radius:3px;">user2</code> /
          <code style="background:#161b22;padding:2px 6px;border-radius:3px;">user3</code> · password: <code style="background:#161b22;padding:2px 6px;border-radius:3px;">password123</code>
        </p>
      </div>
    </div>
  `;
}

function renderLogin() {
  return `
    <div class="container">
      <div class="card auth-card">
        <div class="card-body">
          <h2 class="center-title">Sign in</h2>
          <div class="field"><label>Username</label><input id="liUser" autocomplete="username" /></div>
          <div class="field"><label>Password</label><input id="liPass" type="password" autocomplete="current-password" /></div>
          <button class="btn btn-primary" id="liSubmit" style="width:100%;padding:8px;">Sign in</button>
          <p style="text-align:center;margin-top:14px;font-size:13px;color:#8b949e;">
            No account? <button class="link" id="goSignup">Create one</button>
          </p>
        </div>
      </div>
    </div>
  `;
}

function renderSignup() {
  return `
    <div class="container">
      <div class="card auth-card">
        <div class="card-body">
          <h2 class="center-title">Create account</h2>
          <div class="field"><label>Username</label><input id="suUser" /></div>
          <div class="field"><label>Password</label><input id="suPass" type="password" /></div>
          <button class="btn btn-primary" id="suSubmit" style="width:100%;padding:8px;">Create account</button>
          <p style="text-align:center;margin-top:14px;font-size:13px;color:#8b949e;">
            Already have one? <button class="link" id="goSignin">Sign in</button>
          </p>
        </div>
      </div>
    </div>
  `;
}

function renderMfaChallenge() {
  const u = users[session.pendingMfaUser];
  const methods = [];
  if (u.mfa.passkey) methods.push({ id: 'passkey', label: 'Passkey' });
  if (u.mfa.authenticatorApp) methods.push({ id: 'authenticatorApp', label: 'Authenticator app' });
  if (u.mfa.sms) methods.push({ id: 'sms', label: `SMS (${u.mfa.sms})` });
  if (u.mfa.recoveryCodes.length > 0) methods.push({ id: 'recovery', label: 'Recovery code' });

  const primary = u.mfa.primary && methods.find(m => m.id === u.mfa.primary) ? u.mfa.primary : methods[0]?.id;

  return `
    <div class="container">
      <div class="card auth-card">
        <div class="card-body">
          <h2 class="center-title">Two-factor authentication</h2>
          <p style="text-align:center;color:#8b949e;font-size:13px;">Verify your identity to continue as <strong>${u.username}</strong>.</p>
          <div class="field" style="margin-top:20px;">
            <label>Method</label>
            <select id="mfaMethod" style="width:100%;padding:8px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;">
              ${methods.map(m => `<option value="${m.id}" ${m.id === primary ? 'selected' : ''}>${m.label}${m.id === u.mfa.primary ? ' (primary)' : ''}</option>`).join('')}
            </select>
          </div>
          <div id="mfaInputArea"></div>
          <button class="btn btn-primary" id="mfaVerify" style="width:100%;padding:8px;margin-top:8px;">Verify</button>
          <p style="text-align:center;margin-top:14px;"><button class="link" id="mfaCancel">Cancel</button></p>
        </div>
      </div>
    </div>
  `;
}

function renderProfile() {
  const u = users[session.currentUser];
  const m = u.mfa;

  const methodCard = (opts) => `
    <div class="mfa-method">
      <div class="mfa-icon">${opts.icon}</div>
      <div class="mfa-info">
        <div class="mfa-title-row">
          <span class="mfa-title">${opts.title}</span>
          ${opts.configured ? '<span class="badge badge-success">Configured</span>' : ''}
          ${opts.isPrimary ? '<span class="badge badge-primary">Primary</span>' : ''}
          ${opts.warn ? `<span class="badge badge-warn">${opts.warn}</span>` : ''}
        </div>
        <div class="mfa-desc">${opts.desc}</div>
      </div>
      <div class="mfa-actions">
        ${opts.configured && !opts.isPrimary && opts.canBePrimary ? `<button class="btn" data-primary="${opts.id}">Set primary</button>` : ''}
        ${opts.configured ? `<button class="btn btn-danger" data-remove="${opts.id}">Remove</button>` : ''}
        <button class="btn ${opts.configured ? '' : 'btn-primary'}" data-action="${opts.id}">${opts.configured ? 'Edit' : 'Add'}</button>
      </div>
    </div>
  `;

  return `
    <div class="container">
      <div style="margin-bottom:24px;">
        <h1 style="margin:0 0 4px;font-size:24px;">Account · ${u.username}</h1>
        <p style="margin:0;color:#8b949e;font-size:14px;">Manage your two-factor authentication methods.</p>
      </div>

      <div class="card" style="margin-bottom:20px;">
        <div class="card-header">Two-factor methods</div>
        <div>
          ${methodCard({
            id: 'passkey',
            icon: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v4a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/></svg>',
            title: 'Passkey',
            desc: 'Use a passkey (Face ID, Touch ID, or security key) for phishing-resistant sign-in.',
            configured: m.passkey,
            isPrimary: m.primary === 'passkey',
            canBePrimary: true,
          })}
          ${methodCard({
            id: 'authenticatorApp',
            icon: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18"/></svg>',
            title: 'Authenticator app',
            desc: 'Use an authenticator app to get one-time codes when prompted.',
            configured: m.authenticatorApp,
            isPrimary: m.primary === 'authenticatorApp',
            canBePrimary: true,
          })}
          ${methodCard({
            id: 'sms',
            icon: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
            title: 'SMS / Text message',
            desc: m.sms ? `Codes sent to ${m.sms}. Less secure than other methods.` : 'Get one-time codes via SMS. Less secure — use only as a fallback.',
            configured: !!m.sms,
            isPrimary: m.primary === 'sms',
            canBePrimary: true,
            warn: 'Less secure',
          })}
          ${methodCard({
            id: 'recovery',
            icon: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15v2m0 0v2m0-2h2m-2 0h-2"/><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
            title: 'Recovery codes',
            desc: m.recoveryCodes.length > 0 ? `${m.recoveryCodes.length} unused recovery code(s) remaining. Use only when other methods are unavailable.` : 'Generate one-time codes to use if you lose access to your other methods.',
            configured: m.recoveryCodes.length > 0,
            isPrimary: false,
            canBePrimary: false,
          })}
        </div>
      </div>

      <div id="mfaPanel"></div>
    </div>
  `;
}

/* ============== ACTION HANDLERS ============== */
function bindHome() {
  document.getElementById('heroSignin').onclick = () => { session.view = 'login'; render(); };
  document.getElementById('heroSignup').onclick = () => { session.view = 'signup'; render(); };
}

function bindLogin() {
  const submit = () => {
    const username = document.getElementById('liUser').value.trim();
    const password = document.getElementById('liPass').value;
    const u = users[username];
    if (!u || u.password !== password) { flash('error', 'Invalid username or password'); return; }
    if (hasAnyMfa(u)) { session.pendingMfaUser = username; session.view = 'mfa'; render(); }
    else { session.currentUser = username; session.view = 'profile'; flash('success', `Welcome, ${username}!`); }
  };
  document.getElementById('liSubmit').onclick = submit;
  ['liUser','liPass'].forEach(id => document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }));
  document.getElementById('goSignup').onclick = () => { session.view = 'signup'; render(); };
}

function bindSignup() {
  const submit = () => {
    const username = document.getElementById('suUser').value.trim();
    const password = document.getElementById('suPass').value;
    if (!username || !password) { flash('error', 'Username and password required'); return; }
    if (users[username]) { flash('error', 'Username already taken'); return; }
    users[username] = { username, password, mfa: { recoveryCodes: [], passkey: false, authenticatorApp: false, sms: null, primary: null } };
    session.currentUser = username; session.view = 'profile';
    flash('success', `Account created. Welcome, ${username}!`);
  };
  document.getElementById('suSubmit').onclick = submit;
  ['suUser','suPass'].forEach(id => document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }));
  document.getElementById('goSignin').onclick = () => { session.view = 'login'; render(); };
}

function bindMfa() {
  const u = users[session.pendingMfaUser];
  const sel = document.getElementById('mfaMethod');
  const area = document.getElementById('mfaInputArea');

  function updateInput() {
    const m = sel.value;
    if (m === 'passkey') area.innerHTML = `<p style="color:#8b949e;font-size:13px;">Click Verify to authenticate with your passkey.</p>`;
    else if (m === 'authenticatorApp') area.innerHTML = `<div class="field"><label>6-digit code</label><input id="mfaCode" maxlength="6" placeholder="000000" /></div><p style="color:#6e7681;font-size:12px;">Demo: enter <code>123456</code></p>`;
    else if (m === 'sms') area.innerHTML = `<div class="field"><label>SMS code sent to ${u.mfa.sms}</label><input id="mfaCode" maxlength="6" placeholder="000000" /></div><p style="color:#6e7681;font-size:12px;">Demo: enter <code>654321</code></p>`;
    else if (m === 'recovery') area.innerHTML = `<div class="field"><label>Recovery code</label><input id="mfaCode" placeholder="XXXXXXXXXX" /></div>`;
  }
  sel.onchange = updateInput; updateInput();

  document.getElementById('mfaVerify').onclick = () => {
    const m = sel.value;
    const btn = document.getElementById('mfaVerify');
    btn.disabled = true; btn.textContent = 'Verifying…';
    setTimeout(() => {
      let ok = false;
      if (m === 'passkey') ok = true;
      else if (m === 'authenticatorApp') ok = document.getElementById('mfaCode').value === '123456';
      else if (m === 'sms') ok = document.getElementById('mfaCode').value === '654321';
      else if (m === 'recovery') {
        const code = document.getElementById('mfaCode').value.trim().toUpperCase();
        const idx = u.mfa.recoveryCodes.indexOf(code);
        if (idx >= 0) { u.mfa.recoveryCodes.splice(idx, 1); ok = true; }
      }
      if (ok) {
        session.currentUser = session.pendingMfaUser; session.pendingMfaUser = null;
        session.view = 'profile'; flash('success', 'Verified successfully');
      } else {
        btn.disabled = false; btn.textContent = 'Verify';
        flash('error', 'Verification failed');
      }
    }, 600);
  };
  document.getElementById('mfaCancel').onclick = () => { session.pendingMfaUser = null; session.view = 'login'; render(); };
}

function bindProfile() {
  const u = users[session.currentUser];
  const panel = document.getElementById('mfaPanel');

  document.querySelectorAll('[data-action]').forEach(b => {
    b.onclick = () => openMethodPanel(b.getAttribute('data-action'));
  });
  document.querySelectorAll('[data-primary]').forEach(b => {
    b.onclick = () => { u.mfa.primary = b.getAttribute('data-primary'); flash('success', 'Primary method updated'); };
  });
  document.querySelectorAll('[data-remove]').forEach(b => {
    b.onclick = () => {
      const id = b.getAttribute('data-remove');
      if (id === 'passkey') u.mfa.passkey = false;
      if (id === 'authenticatorApp') u.mfa.authenticatorApp = false;
      if (id === 'sms') u.mfa.sms = null;
      if (id === 'recovery') u.mfa.recoveryCodes = [];
      if (u.mfa.primary === id) u.mfa.primary = null;
      flash('success', 'Method removed');
    };
  });

  function openMethodPanel(id) {
    if (id === 'passkey') {
      panel.innerHTML = `
        <div class="card"><div class="card-header">Passkey</div><div class="card-body">
          <p style="color:#8b949e;font-size:14px;">Register a passkey on this device. (Demo: simulated WebAuthn.)</p>
          <button class="btn btn-primary" id="pkReg">${u.mfa.passkey ? 'Re-register passkey' : 'Register passkey'}</button>
        </div></div>`;
      document.getElementById('pkReg').onclick = () => {
        const b = document.getElementById('pkReg'); b.disabled = true; b.textContent = 'Registering…';
        setTimeout(() => { u.mfa.passkey = true; if (!u.mfa.primary) u.mfa.primary = 'passkey'; flash('success', 'Passkey registered'); }, 700);
      };
    } else if (id === 'authenticatorApp') {
      panel.innerHTML = `
        <div class="card"><div class="card-header">Authenticator app</div><div class="card-body">
          <p style="color:#8b949e;font-size:14px;">Scan the QR code in your authenticator app. (Demo: enter <code>123456</code>.)</p>
          <div style="background:#fff;width:140px;height:140px;display:flex;align-items:center;justify-content:center;color:#000;font-size:11px;border-radius:6px;margin:12px 0;">[QR CODE]</div>
          <div class="field"><label>Verification code</label><input id="aaCode" maxlength="6" placeholder="000000" /></div>
          <button class="btn btn-primary" id="aaVerify">Verify & enable</button>
        </div></div>`;
      document.getElementById('aaVerify').onclick = () => {
        if (document.getElementById('aaCode').value === '123456') {
          u.mfa.authenticatorApp = true; if (!u.mfa.primary) u.mfa.primary = 'authenticatorApp';
          flash('success', 'Authenticator app enabled');
        } else flash('error', 'Invalid code');
      };
    } else if (id === 'sms') {
      panel.innerHTML = `
        <div class="card"><div class="card-header">SMS / Text message</div><div class="card-body">
          <p style="color:#8b949e;font-size:14px;">Enter your phone number to receive codes. (Demo: any number works; verification code is <code>654321</code>.)</p>
          <div class="field"><label>Phone number</label><input id="smsPhone" placeholder="+1 555 123 4567" value="${u.mfa.sms || ''}" /></div>
          <div class="field"><label>Verification code</label><input id="smsCode" maxlength="6" placeholder="000000" /></div>
          <button class="btn btn-primary" id="smsVerify">Verify & enable</button>
        </div></div>`;
      document.getElementById('smsVerify').onclick = () => {
        const phone = document.getElementById('smsPhone').value.trim();
        if (!phone) { flash('error', 'Phone number required'); return; }
        if (document.getElementById('smsCode').value === '654321') {
          u.mfa.sms = phone; if (!u.mfa.primary) u.mfa.primary = 'sms';
          flash('success', 'SMS enabled');
        } else flash('error', 'Invalid code');
      };
    } else if (id === 'recovery') {
      panel.innerHTML = `
        <div class="card"><div class="card-header">Recovery codes</div><div class="card-body">
          <p style="color:#8b949e;font-size:14px;">Generate a fresh set of one-time recovery codes. Save them somewhere safe — each can only be used once.</p>
          ${u.mfa.recoveryCodes.length > 0 ? `<div class="codes-grid">${u.mfa.recoveryCodes.map(c => `<div>${c}</div>`).join('')}</div>` : ''}
          <button class="btn btn-primary" id="rcGen">${u.mfa.recoveryCodes.length > 0 ? 'Regenerate codes' : 'Generate codes'}</button>
        </div></div>`;
      document.getElementById('rcGen').onclick = () => {
        u.mfa.recoveryCodes = Array.from({ length: 5 }, () => genCode(10));
        flash('success', 'Recovery codes generated');
      };
    }
  }
}

/* ============== RENDER ============== */
function render() {
  // remove any existing dropdown
  document.querySelectorAll('.dropdown').forEach(d => d.remove());

  const app = document.getElementById('app');
  let html = '';
  if (session.flash) {
    html += `<div class="container" style="padding-bottom:0;"><div class="flash flash-${session.flash.type}">${session.flash.msg}</div></div>`;
  }

  // Guard: if view requires auth but no user
  if (session.view === 'profile' && !session.currentUser) session.view = 'home';
  if (session.view === 'mfa' && !session.pendingMfaUser) session.view = 'login';

  if (session.view === 'home') html += renderHome();
  else if (session.view === 'login') html += renderLogin();
  else if (session.view === 'signup') html += renderSignup();
  else if (session.view === 'mfa') html += renderMfaChallenge();
  else if (session.view === 'profile') html += renderProfile();

  app.innerHTML = html;
  renderTopbar();

  if (session.view === 'home') bindHome();
  if (session.view === 'login') bindLogin();
  if (session.view === 'signup') bindSignup();
  if (session.view === 'mfa') bindMfa();
  if (session.view === 'profile') bindProfile();
}

document.addEventListener('click', () => {
  if (session.dropdownOpen) { session.dropdownOpen = false; render(); }
});

render();
</script>
</body>
</html>
